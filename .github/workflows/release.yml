name: Release

# Changesets release flow — on the fork this runs for main (upstream sync)
# AND master (fork work; see "Branch structure" in AGENTS.md). It needs a
# FORK_RELEASE_TOKEN until the org stops forcing read-only tokens:
#   1. Changes land on main/master; each user-visible change includes a
#      .changeset/*.md file (see CONTRIBUTING.md).
#   2. When the branch has at least one changeset, this workflow opens/updates a
#      "Version Packages" PR that bumps package.json + writes the accumulated
#      changesets into CHANGELOG.md.
#   3. Merging that PR clears the changeset directory and triggers this same
#      workflow again — this time with no changesets, so `changesets/action`
#      runs our `publish` script (`scripts/release.mjs`), which:
#        - builds pod-alles-okai.zip
#        - creates the vX.Y.Z tag
#        - creates the GitHub Release with pod-alles-okai.zip attached
#      Ghost admin's "Upload theme" flow needs a downloadable zip on the
#      release page — that's the whole reason this workflow exists.

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version PR / release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tag, push, create the GitHub Release
      pull-requests: write # open + update the Version PR
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets/action needs full history to detect what changed
          # between releases and to push its Version PR commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Create Version PR or release
        id: changesets
        uses: changesets/action@v1
        with:
          # `changeset version` — bumps package.json + regenerates CHANGELOG
          # from the accumulated .changeset/*.md files. Runs INSIDE the
          # Version PR branch, not on main.
          version: npm run version
          # `scripts/release.mjs` — builds pod-alles-okai.zip, tags, creates the
          # GitHub Release. Runs AFTER the Version PR merges.
          publish: npm run release
          commit: 'chore: version'
          title: 'chore: version'
          # `scripts/release.mjs` already runs `gh release create` with
          # pod-alles-okai.zip attached, and the action's post-publish hook would
          # otherwise try to create a second Release for the same tag and
          # fail with a 422 (`Validation Failed: … tag_name already_exists`).
          # Disabling the hook keeps the run green.
          createGithubReleases: false
        # Token fallback: the AllesOKAI org forces read-only GITHUB_TOKENs
        # (setup workflow permissions at org level + no per-repo override),
        # so the changesets action cannot push commits, open the Version PR,
        # tag, or create the Release with the default token. Once
        # FORK_RELEASE_TOKEN — a PAT of an org admin (see AGENTS.md,
        # "Releases on the fork") — is added as a repository secret, the
        # flow runs end to end. Until then the run fails at exactly that
        # step, which is the honest state of the permissions.
        env:
          GITHUB_TOKEN: ${{ secrets.FORK_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.FORK_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
